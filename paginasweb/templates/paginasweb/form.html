{% extends "paginasweb/index.html" %}

{% load static %}

<!-- Importar o crispy forms -->
{% load crispy_forms_tags %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <h3>{{titulo}}</h3>

        <p class="texto-info">
            <span>* Campos obrigatórios</span>
        </p>

        <form action="" method="post" id="form-crud">

            {% csrf_token %}

            <!-- Usa o crispy para formatar o form-->
            {{ form|crispy }}

            {% if botao == "Excluir" %}
            <h4>
                Deseja excluir o registro: 
                <span style="color: red;">
                    {{ object }} 
                </span>
            </h4>
            {% endif %}

            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg m-2">
                    <i class="bi bi-check-circle"></i>
                    {{ botao }}
                </button>
                <!-- Link voltar o histórico de navegação -->
                <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg m-2">
                    <i class="bi bi-arrow-left-circle"></i>
                    Voltar
                </a>
            </div>

        </form>

    </div>
</div>
{% endblock %}
